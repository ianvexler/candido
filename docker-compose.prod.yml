# Live production stack. Images are built in CI. Boot runs db:migrate (in-place
# table rename). Do not run db:prepare or db:schema:load against production.

# Docker keeps container logs forever by default; keep at most 30MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  client:
    image: ghcr.io/${GITHUB_REPO_OWNER:-ianvexler}/candido-client:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Where Export's PDFs are made from: the address the app is used at (README, "Export's PDF").
      PDF_PUBLIC_ORIGIN: ${PDF_PUBLIC_ORIGIN:-https://candidohq.com}
      # nginx's certificate is Cloudflare's origin one, which Chrome doesn't trust: its key's hash (README).
      PDF_IGNORE_CERT_SPKI: ${PDF_IGNORE_CERT_SPKI:-}
    # The PDFs' Chrome reaches the site through this host's nginx, not out and back in.
    extra_hosts:
      - "candidohq.com:host-gateway"
    logging: *logging
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER:-ianvexler}/candido-backend:${IMAGE_TAG:-latest}
    env_file: backend/.env
    ports:
      - "8000:8000"
    environment:
      RAILS_ENV: production
      PORT: 8000
    logging: *logging
    restart: unless-stopped
