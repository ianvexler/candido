version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: candido
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_OPTIONS: --max-old-space-size=1536
      # The server's Chrome makes PDFs from the page at the user's own address; inside
      # Docker, localhost is the container, so it reaches the host's ports instead.
      PDF_HOST_RESOLVER_RULES: MAP localhost host.docker.internal
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:3000"
    volumes:
      - ./backend:/app
      - backend_bundle:/usr/local/bundle
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails db:migrate && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      # Host and credentials only: a DATABASE_URL would also override the test
      # database, so specs run in this container would hit development data.
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      CORS_ORIGIN: http://localhost:3000
      # Claude, for CV import and CV reviews; set in .env (see .env.example). Without a
      # key both features report they're unavailable.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CV_TAILOR_MODEL: ${CV_TAILOR_MODEL:-claude-sonnet-5-5}
      CV_IMPORT_MODEL: ${CV_IMPORT_MODEL:-claude-sonnet-5-5}
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    driver: bridge

volumes:
  pgdata:
  backend_bundle:
